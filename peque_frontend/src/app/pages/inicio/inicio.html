<header class="custom-header d-flex align-items-center justify-content-center">
    <h1>VENTAS</h1>
</header>

<main class="main-content container-fluid">
    <div class="row g-4 h-100">

        <div class="col-12 col-lg-3 col-xl-2 d-flex">
            <nav class="sidebar-card w-100">
                <div class="sidebar-title">Menú principal</div>

                <button class="sidebar-btn" [class.active]="moduloSeleccionado === 'ventas'"
                    (click)="seleccionarModulo('ventas')">
                    <i class="bi bi-cart-plus me-2"></i> Ventas
                </button>

                <button class="sidebar-btn" *ngIf="esVendedor()" [class.active]="moduloSeleccionado === 'misVentas'"
                    (click)="seleccionarModulo('misVentas')">
                    <i class="bi bi-bag-check me-2"></i> Mis Ventas
                </button>

                <button class="sidebar-btn" *ngIf="esAdmin()" [class.active]="moduloSeleccionado === 'reportes'"
                    (click)="seleccionarModulo('reportes')">
                    <i class="bi bi-graph-up me-2"></i> Reportes diarios
                </button>

                <button class="sidebar-btn" *ngIf="esAdmin()" [class.active]="moduloSeleccionado === 'movimientos'"
                    (click)="seleccionarModulo('movimientos')">
                    <i class="bi bi-arrow-left-right me-2"></i> Movimientos
                </button>

                <button class="sidebar-btn" *ngIf="esAdmin()" [class.active]="moduloSeleccionado === 'adminCuentas'"
                    (click)="seleccionarModulo('adminCuentas')">
                    <i class="bi bi-people me-2"></i> Admin. cuentas
                </button>

                <hr class="sidebar-divider">
            </nav>
        </div>

        <div class="col-12 col-lg-9 col-xl-10 d-flex">
            <div class="workspace-card w-100">

                <app-ventas *ngIf="moduloSeleccionado === 'ventas'"></app-ventas>
                <app-mis-ventas *ngIf="moduloSeleccionado === 'misVentas'"></app-mis-ventas>
                <app-dashboards *ngIf="moduloSeleccionado === 'reportes'"></app-dashboards>
                <app-movimientos *ngIf="moduloSeleccionado === 'movimientos'"></app-movimientos>

                <app-admin-cuentas *ngIf="moduloSeleccionado === 'adminCuentas'"></app-admin-cuentas>
            </div>
        </div>

    </div>
</main>

<footer class="custom-footer d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <i class="bi bi-person-circle fs-3"></i>
        <span class="fs-6 fw-medium">Bienvenido: <span class="fw-bold">{{ nombreCompleto }}</span></span>
    </div>
    <button class="btn-logout" (click)="abrirModalCerrarSesion()">
        <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
    </button>
</footer>

<app-confirm-modal #confirmModal titulo="Cerrar Sesión" mensaje="¿Estás seguro que deseas cerrar sesión?"
    textoSi="Sí, cerrar sesión" textoNo="No, cancelar" (onConfirm)="confirmarCerrarSesion()">
</app-confirm-modal>
