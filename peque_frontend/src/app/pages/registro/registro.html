<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="registro-container">
        <div class="registro-card">
            <div class="registro-header">
                <i class="bi bi-person-plus"></i>
                <h1>REGISTRO</h1>
                <p>Completa todos los campos con (*)</p>
            </div>
            <div class="registro-body">
                <div *ngIf="error" class="alert alert-danger alert-custom">{{ error }}</div>
                <div *ngIf="mensaje" class="alert alert-success alert-custom">{{ mensaje }}</div>

                <div class="row-custom">
                    <div class="col-custom">
                        <label class="form-label">Tipo Documento *</label>
                        <div class="input-wrapper">
                            <input type="text" value="DNI" readonly>
                        </div>
                    </div>
                    <div class="col-custom" style="flex: 2;">
                        <label class="form-label">Número Documento *</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.numeroDocumento" (input)="restringirDni()"
                                inputmode="numeric" maxlength="8" placeholder="Número Documento">
                            <button class="btn-buscar" (click)="buscarDocumento()" [disabled]="buscando">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row-custom">
                    <div class="col-custom">
                        <label class="form-label">Primer Nombre *</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.nombre" placeholder="Buscar por DNI" readonly>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Segundo Nombre</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.segundoNombre" placeholder="Buscar por DNI" readonly>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Apellido Paterno *</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.apellidoPat" placeholder="Buscar por DNI" readonly>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Apellido Materno *</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.apellidoMat" placeholder="Buscar por DNI" readonly>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Teléfono *</label>
                        <div class="input-wrapper">
                            <input type="tel" [(ngModel)]="usuario.telefono" (input)="restringirTelefono()"
                                inputmode="numeric" maxlength="9" placeholder="Teléfono">
                            <span class="icon"><i class="bi bi-phone"></i></span>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Correo Electrónico *</label>
                        <div class="input-wrapper">
                            <input type="email" [(ngModel)]="usuario.correo" placeholder="Correo Electrónico">
                            <span class="icon"><i class="bi bi-envelope"></i></span>
                        </div>
                    </div>
                </div>

                <div class="row-custom">
                    <div class="col-custom">
                        <label class="form-label">Contraseña *</label>
                        <div class="input-wrapper">
                            <input id="password" type="password" [(ngModel)]="usuario.password" placeholder="********">
                            <span class="icon" (click)="togglePassword('password')">
                                <i class="bi bi-eye-slash-fill"></i>
                            </span>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Confirmar Contraseña *</label>
                        <div class="input-wrapper">
                            <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword"
                                placeholder="********">
                            <span class="icon" (click)="togglePassword('confirmPassword')">
                                <i class="bi bi-eye-slash-fill"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="row-custom">
                    <div class="col-custom">
                        <label class="form-label">Ubigeo</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.codigo_postal" placeholder="Ubigeo">
                            <button class="btn-buscar" (click)="buscarPorUbigeoManual()" title="Buscar ubicación">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Departamento *</label>
                        <div class="input-wrapper">
                            <select [(ngModel)]="usuario.departamentoCode" (ngModelChange)="onDepartamentoChange()">
                                <option value="">Seleccione un departamento</option>
                                <option *ngFor="let dep of departamentos" [value]="dep.code">{{ dep.name }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Provincia *</label>
                        <div class="input-wrapper">
                            <select [(ngModel)]="usuario.provinciaCode" (ngModelChange)="onProvinciaChange()"
                                [disabled]="!usuario.departamentoCode">
                                <option value="">{{ usuario.departamentoCode ? 'Seleccione una provincia' : 'Seleccione
                                    un departamento primero' }}</option>
                                <option *ngFor="let prov of provincias" [value]="prov.code">{{ prov.name }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Distrito *</label>
                        <div class="input-wrapper">
                            <select [(ngModel)]="usuario.distritoCode" [disabled]="!usuario.provinciaCode">
                                <option value="">{{ usuario.provinciaCode ? 'Seleccione un distrito' : 'Seleccione una
                                    provincia primero' }}</option>
                                <option *ngFor="let dist of distritos" [value]="dist.code">{{ dist.name }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Calle *</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.calle" placeholder="Calle">
                        </div>
                    </div>
                    <div class="col-custom">
                        <label class="form-label">Referencia</label>
                        <div class="input-wrapper">
                            <input type="text" [(ngModel)]="usuario.referencia" placeholder="Referencia">
                        </div>
                    </div>
                </div>

                <button class="btn-submit" [disabled]="loading" (click)="registrar()">
                    {{ loading ? 'REGISTRANDO...' : 'CREAR CUENTA' }}
                </button>

                <div class="registro-footer">
                    <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
